[project]
name = "graph-rag"
version = "0.3.0"
description = "Library-first graph-rag bootstrap"
readme = "README.md"
authors = [
    { name = "Pete Forrest", email = "petemforrest@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-cosmos>=4.7.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
graph-rag = "graph_rag.cli:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
